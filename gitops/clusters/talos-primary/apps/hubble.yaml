apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KostaGorod/kubernetes-talos-apps.git
    targetRevision: main
    path: gitops/platform/hubble
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
