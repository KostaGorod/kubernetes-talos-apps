apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.102.4
    helm:
      releaseName: tailscale-operator
      values: |
        operatorConfig:
          defaultTags:
            - tag:talos-develop-k8s-operator
        proxyConfig:
          defaultTags: tag:talos-develop-service
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
