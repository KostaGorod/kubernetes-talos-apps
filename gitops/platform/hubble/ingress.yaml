apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble
  namespace: kube-system
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/tags: tag:prod-app
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hubble
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
