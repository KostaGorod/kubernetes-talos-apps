apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-primary-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KostaGorod/kubernetes-talos-apps.git
    targetRevision: main
    path: gitops/clusters/talos-primary/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
# Keep the first reconciliation deliberate while the initial app allowlist is empty.
