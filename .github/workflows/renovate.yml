name: Renovate

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.repository == 'KostaGorod/kubernetes-talos-apps' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create repository-scoped Renovate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
          permission-checks: read
          permission-statuses: write
      - name: Require the validation ruleset before enabling updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          required=$(gh api "repos/$GH_REPO/rules/branches/main" --paginate | jq -s '
            any(.[][];
              .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              any(.parameters.required_status_checks[];
                .context == "Validate GitOps configuration" and .integration_id == 15368))')
          if [ "$required" != true ]; then
            printf '%s\n' '::error::Require strict validation on main. See docs/dependency-updates.md.'
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Renovate
        run: npx --yes --ignore-scripts --package=renovate@44.186.6 renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_SUPPRESS_NOTIFICATIONS: configErrorIssue
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
