name: Renovate

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.repository == 'KostaGorod/kubernetes-talos-apps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.0.0
        id: checkout
        with:
          persist-credentials: false
      - name: Record image versions before Renovate
        run: bash .github/scripts/renovate-report.sh before
      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776  # v46.3.10
        with:
          token: ${{ github.token }}
          renovate-image: >-
            ghcr.io/renovatebot/renovate:44.186.6@sha256:461ab1d41744ecd9e16607a7f939183c783a19ce1968f32c87c122759676df04
          mount-docker-socket: 'false'
          docker-volumes: ''
          env-regex: '^(?:RENOVATE_[A-Z_]+|LOG_LEVEL)$'
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_SUPPRESS_NOTIFICATIONS: configErrorIssue
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOW_PLUGINS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_FORCE: >-
            {"platformAutomerge":true,"dependencyDashboard":false,"branchPrefix":"renovate/",
            "enabledManagers":["kubernetes"],"schedule":["at any time"]}
      - name: Report versions and update PRs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        run: bash .github/scripts/renovate-report.sh after
