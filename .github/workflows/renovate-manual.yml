name: Renovate now

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-manual
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.repository == 'KostaGorod/kubernetes-talos-apps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Run Renovate now and create update PRs
        run: >-
          npx --yes --ignore-scripts --package=renovate@44.186.6 renovate
          --automerge=false
          --dependency-dashboard=false
          --branch-prefix=renovate-manual/
          --enabled-managers='["kubernetes"]'
          --schedule='["at any time"]'
          --pr-hourly-limit=0
          --pr-concurrent-limit=0
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_SUPPRESS_NOTIFICATIONS: configErrorIssue
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOW_PLUGINS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
