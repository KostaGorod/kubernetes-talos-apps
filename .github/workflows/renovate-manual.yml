name: Renovate now

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-manual
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.repository == 'KostaGorod/kubernetes-talos-apps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.0.0
        id: checkout
        with:
          persist-credentials: false
      - name: Record current versions and open update PRs
        id: before
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { snapshot } = require('./.github/scripts/renovate-report.cjs');
            const before = await snapshot({ github, context });
            for (const [name, image] of Object.entries(before.images)) core.info(`${name}: ${image}`);
            return before;
      - name: Run Renovate now and create update PRs
        id: renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776  # v46.3.10
        with:
          token: ${{ github.token }}
          renovate-image: >-
            ghcr.io/renovatebot/renovate:44.186.6@sha256:461ab1d41744ecd9e16607a7f939183c783a19ce1968f32c87c122759676df04
          mount-docker-socket: 'false'
          docker-volumes: ''
          env-regex: '^(?:RENOVATE_[A-Z_]+|LOG_LEVEL)$'
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_SUPPRESS_NOTIFICATIONS: configErrorIssue
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOW_PLUGINS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_FORCE: >-
            {"platformAutomerge":true,"dependencyDashboard":false,"branchPrefix":"renovate-manual/",
            "enabledManagers":["kubernetes"],"schedule":["at any time"],
            "prHourlyLimit":0,"prConcurrentLimit":0}
      - name: Report versions, PR outcomes and unchanged dependencies
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BEFORE: ${{ steps.before.outputs.result }}
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { report } = require('./.github/scripts/renovate-report.cjs');
            try {
              await report({ github, context, core,
                before: process.env.BEFORE ? JSON.parse(process.env.BEFORE) : undefined,
                outcome: process.env.RENOVATE_OUTCOME });
            } catch (error) {
              await core.summary.addHeading('Renovate report unavailable')
                .addRaw('Version/PR lookup failed. Do not treat this as an unchanged or successful update.').write();
              core.setFailed(error.message);
            }
