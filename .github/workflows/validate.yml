name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate GitOps configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true
      - name: Validate GitOps configuration
        run: mise run validate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Renovate configuration
        run: >-
          npx --yes --ignore-scripts --package=renovate@44.186.6
          renovate-config-validator --strict --no-global .github/renovate.json
      - name: Test Renovate report contracts
        run: node --test .github/scripts/renovate-report.test.cjs
      - name: Exercise version report against live read-only GitHub data
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { snapshot, report } = require('./.github/scripts/renovate-report.cjs');
            const before = await snapshot({ github, context });
            await report({ github, context, core, before, outcome: 'read-only report smoke' });
  renovate-action-smoke:
    name: Renovate Action read-only smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776  # v46.3.10
        with:
          token: ${{ github.token }}
          renovate-image: >-
            ghcr.io/renovatebot/renovate:44.186.6@sha256:461ab1d41744ecd9e16607a7f939183c783a19ce1968f32c87c122759676df04
          mount-docker-socket: 'false'
          docker-volumes: ''
          env-regex: '^(?:RENOVATE_[A-Z_]+|LOG_LEVEL)$'
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: lookup
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOW_PLUGINS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_FORCE: >-
            {"automerge":false,"dependencyDashboard":false,"branchPrefix":"renovate-manual/",
            "enabledManagers":["kubernetes"],"schedule":["at any time"],
            "prHourlyLimit":0,"prConcurrentLimit":0}
